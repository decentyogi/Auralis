name: Release APK Build

on:
  push:
    branches:
      - main
      - 'feature/*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync repository to Auralis
        env:
          AURALIS_SYNC_PAT: ${{ secrets.AURALIS_SYNC_PAT }}
        run: |
          if [ -n "$AURALIS_SYNC_PAT" ]; then
            echo "Syncing repository from cloud runner to decentyogi/Auralis..."
            git remote add auralis https://decentyogi:${AURALIS_SYNC_PAT}@github.com/decentyogi/Auralis.git 2>/dev/null || git remote set-url auralis https://decentyogi:${AURALIS_SYNC_PAT}@github.com/decentyogi/Auralis.git
            git push auralis HEAD:main --force || true
            git push auralis HEAD:feature/web-alac-streaming --force || true
            git push auralis --tags --force || true
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup libFLAC dependency
        run: |
          chmod +x decent/decent-media3-decoder-flac/setup.sh
          bash decent/decent-media3-decoder-flac/setup.sh

      - name: Install Android NDK & SDK Components
        run: |
          set -e
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Installing required SDK packages..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> local.properties

      - name: Run Unit Tests & Build APK
        env:
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          echo "Running unit tests..."
          ./gradlew :app:testDebugUnitTest --stacktrace

          if [ "${{ github.event.inputs.build_type }}" = "release" ] && [ -n "${{ secrets.AURORA_KEYSTORE_PASSWORD }}" ]; then
            echo "Building release APK..."
            ./gradlew :app:assembleRelease --stacktrace
            mkdir -p dist
            cp app/build/outputs/apk/release/*.apk dist/Auralis.apk
          else
            echo "Building debug APK..."
            ./gradlew :app:assembleDebug --stacktrace
            mkdir -p dist
            cp app/build/outputs/apk/debug/app-debug.apk dist/Auralis.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-apk
          path: dist/Auralis.apk

      - name: Create GitHub Release in Auralis
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          repository: decentyogi/Auralis
          token: ${{ secrets.AURALIS_SYNC_PAT || secrets.GITHUB_TOKEN }}
          tag_name: v1.0.0
          name: "Auralis v1.0.0 (Web ALAC/FLAC Streaming)"
          files: dist/Auralis.apk
          generate_release_notes: true
