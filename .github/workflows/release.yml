name: Release APK Build

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'fix/*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Sync repository to Auralis (external fork only)
        if: github.repository != 'decentyogi/Auralis' && env.AURALIS_SYNC_PAT != ''
        env:
          AURALIS_SYNC_PAT: ${{ secrets.AURALIS_SYNC_PAT }}
        run: |
          echo "Syncing repository from cloud runner to decentyogi/Auralis..."
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git push "https://decentyogi:${AURALIS_SYNC_PAT}@github.com/decentyogi/Auralis.git" HEAD:refs/heads/main --force || true
          git push "https://decentyogi:${AURALIS_SYNC_PAT}@github.com/decentyogi/Auralis.git" HEAD:refs/heads/feature/web-alac-streaming --force || true
          git push "https://decentyogi:${AURALIS_SYNC_PAT}@github.com/decentyogi/Auralis.git" --tags --force || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup libFLAC dependency
        run: |
          chmod +x decent/decent-media3-decoder-flac/setup.sh
          bash decent/decent-media3-decoder-flac/setup.sh

      - name: Install Android NDK & SDK Components
        run: |
          set -e
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Installing required SDK packages..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> local.properties

      - name: Determine Target Build Type
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_BUILD="${{ github.event.inputs.build_type }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET_BUILD="release"
          else
            TARGET_BUILD="debug"
          fi
          echo "build_type=$TARGET_BUILD" >> $GITHUB_OUTPUT
          echo "Selected build type: $TARGET_BUILD"

      - name: Restore Keystore & Validate Secrets (Release only)
        if: steps.cfg.outputs.build_type == 'release'
        env:
          AURORA_KEYSTORE_BASE64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          MISSING=0
          if [ -z "$AURORA_KEYSTORE_BASE64" ]; then echo "::error::Required secret AURORA_KEYSTORE_BASE64 is missing"; MISSING=1; fi
          if [ -z "$AURORA_KEYSTORE_PASSWORD" ]; then echo "::error::Required secret AURORA_KEYSTORE_PASSWORD is missing"; MISSING=1; fi
          if [ -z "$AURORA_KEY_ALIAS" ]; then echo "::error::Required secret AURORA_KEY_ALIAS is missing"; MISSING=1; fi
          if [ -z "$AURORA_KEY_PASSWORD" ]; then echo "::error::Required secret AURORA_KEY_PASSWORD is missing"; MISSING=1; fi
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Release build requested but signing secrets are missing. Will not silently fall back to debug. Failing."
            exit 1
          fi
          mkdir -p keystore
          echo "$AURORA_KEYSTORE_BASE64" | base64 -d > keystore/aurora-release.jks
          echo "Keystore successfully decoded to keystore/aurora-release.jks"

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          echo "Running unit tests (:core:test and :app:testDebugUnitTest)..."
          ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Build APK
        id: build_step
        env:
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          BUILD_TYPE="${{ steps.cfg.outputs.build_type }}"
          VERSION_NAME=$(grep "^versionName=" version.properties | cut -d'=' -f2 | tr -d '\r')

          if [ "$BUILD_TYPE" = "release" ]; then
            echo "Building signed RELEASE APK with versionName=$VERSION_NAME..."
            RELEASE_TAG="${{ github.ref_name }}"
            if [[ "$RELEASE_TAG" != v* ]]; then
              RELEASE_TAG="v$VERSION_NAME"
            fi
            ./gradlew :app:assembleRelease -PreleaseTag="$RELEASE_TAG" --stacktrace
            cp app/build/outputs/apk/release/*.apk dist/Auralis.apk
            echo "apk_path=dist/Auralis.apk" >> $GITHUB_OUTPUT
            echo "artifact_name=Auralis-apk" >> $GITHUB_OUTPUT
          else
            echo "Building DEBUG APK..."
            ./gradlew :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/*.apk dist/Auralis-debug.apk
            echo "apk_path=dist/Auralis-debug.apk" >> $GITHUB_OUTPUT
            echo "artifact_name=Auralis-debug-apk" >> $GITHUB_OUTPUT
          fi

      - name: Verify Signed Release APK
        if: steps.cfg.outputs.build_type == 'release'
        run: |
          set -e
          APK="dist/Auralis.apk"
          echo "=== Verifying APK Signature with apksigner ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK" > cert_info.txt
          cat cert_info.txt

          echo "=== Checking Certificate Dignity ==="
          if grep -qi "Android Debug" cert_info.txt; then
            echo "::error::Verification failed: APK was signed with Android Debug certificate!"
            exit 1
          fi

          echo "=== Verifying APK is NOT Debuggable ==="
          BADGING=$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::Verification failed: APK has application-debuggable flag set!"
            exit 1
          fi
          echo "APK verification passed: valid release signature, not debuggable."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_step.outputs.artifact_name }}
          path: ${{ steps.build_step.outputs.apk_path }}

      - name: Publish Release to GitHub
        if: startsWith(github.ref, 'refs/tags/v') && steps.cfg.outputs.build_type == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Publishing release for tag $TAG to decentyogi/Auralis..."
          gh release upload "$TAG" dist/Auralis.apk --repo decentyogi/Auralis --clobber || \
          gh release create "$TAG" dist/Auralis.apk --repo decentyogi/Auralis --title "Auralis $TAG" --generate-notes
